name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  queue:
    # Enable separately only after the operator verifies effective main protections.
    if: >-
      vars.DEPENDABOT_AUTO_MERGE_ENABLED == 'true' &&
      github.repository == 'tonyputi/traverse' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == 'tonyputi/traverse'
    runs-on: ubuntu-latest

    steps:
      # Never checkout code, restore caches or download artifacts in this workflow.
      - name: Verify current Dependabot PR metadata
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUEUE_ENABLED: ${{ vars.DEPENDABOT_AUTO_MERGE_ENABLED }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # Actions expression string comparisons ignore case; Bash enforces exact opt-in.
          if [[ "$QUEUE_ENABLED" != true ]]; then
            exit 0
          fi
          number=$(gh api --method GET repos/tonyputi/traverse/pulls \
            -f state=open -f base=main -f "head=tonyputi:$HEAD_BRANCH" | \
            jq -r --arg sha "$HEAD_SHA" --arg branch "$HEAD_BRANCH" '
              [.[] | select(
                .state == "open" and .draft == false and
                .user.login == "dependabot[bot]" and
                .user.id == 49699333 and .user.type == "Bot" and
                .base.repo.full_name == "tonyputi/traverse" and .base.ref == "main" and
                .head.repo.full_name == "tonyputi/traverse" and
                .head.ref == $branch and (.head.ref | startswith("dependabot/")) and
                .head.sha == $sha
              )] | if length == 1 then .[0].number else empty end')
          if [[ "$number" =~ ^[1-9][0-9]*$ ]]; then
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi

      - name: Create repository-scoped queue token
        if: steps.metadata.outputs.number != ''
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.DEPENDABOT_QUEUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_QUEUE_APP_PRIVATE_KEY }}
          owner: tonyputi
          repositories: traverse
          permission-contents: write
          permission-pull-requests: write

      - name: Enable native auto-merge without approval
        if: steps.metadata.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.metadata.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh pr merge "$PR_NUMBER" --repo tonyputi/traverse \
            --auto --squash --match-head-commit "$HEAD_SHA"
