name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  queue:
    if: vars.DEPENDABOT_AUTO_MERGE_ENABLED == 'true'
    uses: tonyputi/.github/.github/workflows/queue-dependabot.yml@186cdea1d567723c648ed18020167b7d70fc2337
    with:
      validation_workflow: .github/workflows/quality.yml
    secrets:
      github_app_private_key: ${{ secrets.DEPENDABOT_QUEUE_APP_PRIVATE_KEY }}
