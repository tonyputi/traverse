name: Enhancement
description: Propose a focused improvement to Traverse
title: "[Enhancement] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Explain the user need this would address.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: State what the change should and should not include.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true
